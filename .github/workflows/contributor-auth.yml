name: Contributor login and frozen-route checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r benchmark/requirements.txt
      - name: Offline contributor and credential lifecycle regressions
        run: python -m unittest discover -s benchmark/tests -p 'test_contrib*.py'
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
          LITELLM_MODE: PRODUCTION
      - run: python -m compileall -q benchmark/contrib
