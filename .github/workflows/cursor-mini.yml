name: Experimental Cursor mini offline checks
on:
  pull_request:
    paths: ['benchmark/experimental/cursor_sdk/**', '.github/workflows/cursor-mini.yml']
  push:
    branches: [main]
    paths: ['benchmark/experimental/cursor_sdk/**', '.github/workflows/cursor-mini.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install -r benchmark/requirements.txt
      - run: npm ci --ignore-scripts
        working-directory: benchmark/experimental/cursor_sdk
      - run: node --test benchmark/experimental/cursor_sdk/bridge.test.mjs
      - run: python -m unittest benchmark.experimental.cursor_sdk.test_model
      - run: python -m benchmark.experimental.cursor_sdk.probe --help
