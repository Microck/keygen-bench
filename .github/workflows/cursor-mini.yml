name: Experimental Cursor mini offline checks
on:
  pull_request:
    paths: ['benchmark/experimental/cursor_sdk/**', 'benchmark/*.py', 'benchmark/contrib/**', 'benchmark/prompts/**', 'benchmark/requirements*.txt', 'benchmark/tests/**', 'benchmark/Dockerfile', 'benchmark/ft2_capture.patch', 'scripts/build-ft2*', 'tools/ft2_smoke.py', 'data/keygen-*.json', '.github/workflows/cursor-mini.yml']
  push:
    branches: [main]
    paths: ['benchmark/experimental/cursor_sdk/**', 'benchmark/*.py', 'benchmark/contrib/**', 'benchmark/prompts/**', 'benchmark/requirements*.txt', 'benchmark/tests/**', 'benchmark/Dockerfile', 'benchmark/ft2_capture.patch', 'scripts/build-ft2*', 'tools/ft2_smoke.py', 'data/keygen-*.json', '.github/workflows/cursor-mini.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install -r benchmark/requirements.txt
      - run: npm ci --ignore-scripts
        working-directory: benchmark/experimental/cursor_sdk
      - run: node --test benchmark/experimental/cursor_sdk/bridge.test.mjs
      - run: python -m unittest benchmark.experimental.cursor_sdk.test_model benchmark.experimental.cursor_sdk.test_full_run
      - run: python -m benchmark.experimental.cursor_sdk.probe --help
      - run: python -m benchmark.experimental.cursor_sdk.full_run --help

  native-render-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            benchmark
            scripts
            tools
            data
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install -r benchmark/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libmicrohttpd-dev ffmpeg
      - run: python scripts/build-ft2-analysis.py
      - run: docker build -f benchmark/Dockerfile --target agent -t keygen-cursor-fixture .
      - run: echo "KEYGEN_CURSOR_NATIVE_TEST_IMAGE=$(docker image inspect keygen-cursor-fixture --format '{{.Id}}')" >> "$GITHUB_ENV"
      - run: python -m unittest benchmark.experimental.cursor_sdk.test_native_full_run
        env:
          KEYGEN_LISTENER_PYTHON: ${{ github.workspace }}/benchmark/tests/fake_listener.py
