name: Deterministic website flows
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/runs/
            !/submissions/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify deployment export and sparse-checkout inputs
        run: python -m unittest discover -s scripts/tests
      - run: npm ci
      - run: npm run test:web
      - run: npx e2e-web install chromium --with-deps
      - run: npm run test:e2e
        env:
          E2E_TELEMETRY_DISABLED: '1'
      - name: Preserve failed deterministic browser traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deterministic-browser-failure-traces
          path: .e2e/results/
          retention-days: 7
          if-no-files-found: ignore
