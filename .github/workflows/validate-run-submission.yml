name: Validate community run submissions
on:
  pull_request:
    paths:
      - 'submissions/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Execute only validator code from the trusted base. PR content is data.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: incoming
          persist-credentials: false
          sparse-checkout: /submissions/
          sparse-checkout-cone-mode: false
      - name: Validate bundles using trusted code
        run: |
          python3 -I - <<'PY'
          import importlib.util
          from pathlib import Path
          specification = importlib.util.spec_from_file_location(
              'bundle_validator', 'trusted/benchmark/contrib/validate_bundle.py')
          validator = importlib.util.module_from_spec(specification)
          specification.loader.exec_module(validator)
          try:
              count = validator.validate_changes(Path('trusted/submissions'), Path('incoming/submissions'))
          except Exception as error:
              # Do not print untrusted filenames or potentially sensitive values.
              raise SystemExit('Bundle rejected: ' + type(error).__name__)
          print(f'Validated {count} new or changed community bundles')
          PY
