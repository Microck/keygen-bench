name: Native route adapter regressions
on:
  pull_request:
    paths: ['benchmark/**', '.github/workflows/native-route-adapters.yml']
  push:
    branches: [main]
    paths: ['benchmark/**', '.github/workflows/native-route-adapters.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/runs/
            !/submissions/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r benchmark/requirements.txt
      - name: Offline adapter and native protocol regressions
        run: python -m unittest benchmark.tests.test_route_policy benchmark.tests.test_native_models
        env:
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
          LITELLM_MODE: PRODUCTION
