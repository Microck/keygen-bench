name: Trusted synthetic sandbox
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmark/run.py'
      - 'benchmark/native_models.py'
      - 'benchmark/campaign.py'
      - 'benchmark/contrib/cli.py'
      - 'benchmark/artifacts.py'
      - 'benchmark/bridge.py'
      - 'benchmark/Dockerfile'
      - 'benchmark/score*.py'
      - 'benchmark/requirements*.txt'
      - 'scripts/build-ft2*.py'
      - 'scripts/build-ft2*.sh'
      - '.github/workflows/synthetic-sandbox.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/runs/
            !/submissions/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-venv build-essential git pkg-config libsdl2-dev libmicrohttpd-dev ffmpeg
      # setup retains its 20 GiB free-space admission check; show the actual
      # hosted runner capacity rather than weakening or bypassing that check.
      - name: Report available setup disk space
        run: df -h "$RUNNER_TEMP"
      - name: Set up pinned renderer, images and listener
        env:
          KEYGEN_FT2_ANALYSIS: ${{ runner.temp }}/keygen-ft2-analysis
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
        run: python benchmark/contrib/cli.py setup --home "$RUNNER_TEMP/keygen-setup"
      - name: Verify scorer fingerprint initialization
        run: '"$RUNNER_TEMP/keygen-setup/venv/bin/python" -m unittest benchmark.tests.test_score.ScoreTests.test_numerical_identity_initializes_mmap_before_fingerprinting'
      - name: Generate a synthetic tracker module
        run: |
          "$RUNNER_TEMP/keygen-setup/venv/bin/python" - <<'PY'
          from pathlib import Path
          from benchmark.tests.test_score_playback import fixture_xm, NOTE, EMPTY
          import os
          Path(os.environ['RUNNER_TEMP'], 'synthetic.xm').write_bytes(fixture_xm([[NOTE] + [EMPTY] * 63], speed=6))
          PY
      - name: Collect, render and score without provider traffic
        env:
          KEYGEN_FT2_ANALYSIS: ${{ runner.temp }}/keygen-ft2-analysis
          KEYGEN_LISTENER_PYTHON: ${{ runner.temp }}/keygen-setup/listener-venv/bin/python
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
        run: |
          if ! "$RUNNER_TEMP/keygen-setup/venv/bin/python" benchmark/contrib/cli.py doctor --infrastructure-only --sandbox \
            --xm "$RUNNER_TEMP/synthetic.xm" --work "$RUNNER_TEMP/keygen-synthetic-evidence"; then
            "$RUNNER_TEMP/keygen-setup/venv/bin/python" - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP'], 'keygen-synthetic-evidence/sandbox-smoke/profile.json')
          if path.is_file():
              profile = json.loads(path.read_text())
              print(json.dumps({key: profile.get(key) for key in ('evaluation_status', 'evaluation_error')}))
          else:
              print('No synthetic profile was produced.')
          PY
            # Diagnostic only: re-evaluate the synthetic evidence in a fresh process.
            # Print changed field names, never values. A failed original run stays failed.
            "$RUNNER_TEMP/keygen-setup/venv/bin/python" - <<'PY' || true
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "benchmark"))
          import score
          original = score.profile_inputs
          snapshots = []
          def capture(path):
              value = original(path)
              snapshots.append(value)
              return value
          score.profile_inputs = capture
          attempt = Path(os.environ["RUNNER_TEMP"], "keygen-synthetic-evidence/sandbox-smoke")
          score.profile_attempt(attempt, force=True)
          def changed(a, b, prefix=""):
              if isinstance(a, dict) and isinstance(b, dict):
                  for key in sorted(a.keys() | b.keys()):
                      name = f"{prefix}.{key}" if prefix else str(key)
                      if key not in a or key not in b:
                          print("changed field:", name)
                      else:
                          changed(a[key], b[key], name)
              elif a != b:
                  print("changed field:", prefix)
          if len(snapshots) >= 2:
              changed(snapshots[0], snapshots[-1])
          else:
              print("Diagnostic did not capture both fingerprints")
          PY
            exit 1
          fi
