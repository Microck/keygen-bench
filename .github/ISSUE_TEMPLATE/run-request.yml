name: Request a model run
description: Request an exact model and documented route. This does not authorize spending.
title: 'Run request: '
labels: []
body:
  - type: input
    id: model
    attributes:
      label: Exact model ID
      description: No aliases or substitute checkpoints.
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Provider, API protocol, and public base URL
      description: Never include credentials or private company endpoints.
    validations:
      required: true
  - type: textarea
    id: tier
    attributes:
      label: Highest documented reasoning tier and output cap
      description: Include primary documentation URLs and the native generation settings.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Availability and notes
      description: State whether you can contribute a three-attempt run. Do not include personal or company data.
