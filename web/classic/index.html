<!doctype html>
<!-- FT2-styled results site. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keygen Bench</title>
<!--OG-->
<link rel="icon" type="image/png" href="/core/icons/keys.png">
<link rel="stylesheet" href="/core/ft2.css">
<style>
  html, body { margin: 0; background: #000; min-height: 100%; }
  #boot { color: #92BEFF; font: 12px ui-monospace, monospace; padding: 20px; }
  /* Preloader (core/intro.js). --k is its integer pixel scale; the overlay adds a dark scanline per pixel row. */
  #intro { position: fixed; inset: 0; z-index: 100; overflow: hidden; }
  #intro canvas { display: block; image-rendering: pixelated; }
  #intro::after { content: ""; position: absolute; inset: 0; pointer-events: none; transition: opacity 400ms ease-out;
    background: repeating-linear-gradient(to bottom, transparent 0 calc(var(--k) - var(--scan)), rgb(0 0 0 / 0.3) 0 var(--k)); }
  #intro.out { pointer-events: none; }
  #intro.out::after { opacity: 0; }
  #intro.fade { opacity: 0; transition: opacity 200ms ease-out; }
  .intro-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<script src="/core/intro.js"></script>
<div id="app"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
