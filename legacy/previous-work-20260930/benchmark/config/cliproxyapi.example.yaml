# Client transport settings only. Configure authorized upstream access separately.
# This file does not log in, extract tokens, or authorize subscription reuse.
host: "127.0.0.1"
port: 8317
auth-dir: "~/.cli-proxy-keygen-benchmark"
api-keys:
  - "REPLACE_WITH_RANDOM_LOCAL_CLIENT_KEY"
remote-management:
  allow-remote: false
  secret-key: ""
  disable-control-panel: true
request-retry: 0
max-retry-credentials: 1
max-retry-interval: 0
disable-claude-cloak-mode: true
claude-code:
  disable-cloaking-model-list: true
disable-image-generation: "passthrough"
quota-exceeded:
  switch-project: false
  switch-preview-model: false
  antigravity-credits: false
routing:
  strategy: "fill-first"
plugins:
  enabled: false
payload: {}
oauth-model-alias: {}
# Per-credential overrides and upstream prompt transformations still need review.
# Use a dedicated, fixed upstream route per model; do not pool accounts.
